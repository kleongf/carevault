<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chest X-ray Review</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div class="mark">CV</div><div><h1>Chest X-ray Review</h1></div><a class="secondary icon-button" href="http://127.0.0.1:3040/" target="_blank" rel="noreferrer" aria-label="Open CareVault" title="Open CareVault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M10 5H5v14h14v-5"/></svg></a></header>
<div class="about-bar"><span class="badge">Research demo</span><details class="about" id="data-usage"><summary class="icon-button" aria-label="About and data usage" title="About and data usage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg></summary><div class="about-content"><p>Unverified model output, not a diagnosis. Scores are not disease probabilities.</p><p>Images stay local. Classifier scores go to OpenRouter and its provider.</p><p>Saved reports remain unshared.</p></div></details></div>
<section class="panel" id="login"><h2>Sign in</h2><form id="login-form"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="100" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required><button id="sign-in" type="submit">Sign in</button><p id="login-error" role="alert"></p></form></section>
<div id="workspace" hidden><div class="session-bar"><button id="sign-out" class="secondary icon-button" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H5v14h4M14 8l4 4-4 4M8 12h10"/></svg></button></div>
<section class="panel"><div class="section-title"><h2>Shared images</h2><button id="refresh" class="secondary icon-button" aria-label="Refresh" title="Refresh shared images"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-2L20 8M4 16l2.4 3A7 7 0 0 0 18 17"/></svg></button></div>
<label for="image">Image</label><select id="image"><option value="">Loading…</option></select>
<label for="variant">Shared version</label><select id="variant"></select>
<img id="preview" alt="Selected shared chest X-ray" hidden>
<button id="analyze" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/></svg><span>Analyze image</span></button><p id="status" role="status" aria-live="polite"></p></section>
<section class="panel" id="result" hidden><div class="section-title"><h2>Research report</h2><span class="badge">Unverified</span></div><pre id="report" tabindex="0" aria-label="Unverified research report"></pre><button id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg><span>Save to CareVault</span></button></section>
</div></main><script src="/app.js"></script></body></html>
